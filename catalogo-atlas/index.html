<meta name="author" content="Ismael Alves">

<style>
/* Layout: barra de busca fixa no topo + grade de cartões de produto; clique abre a página do catálogo */
:root{--bg:#f3f4f6;--surface:#fff;--ink:#16202e;--muted:#5d6878;--line:#d9dde4;--accent:#1c4f9c;--accent-ink:#fff;--ok:#1d7a46;--okbg:#e2f3e9;--warn:#8a5a00;--warnbg:#fbefd2;--shadow:0 1px 2px rgba(20,30,50,.08);
--display:'Barlow Semi Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--surface:#1a222e;--ink:#e8edf4;--muted:#9aa6b6;--line:#2c3746;--accent:#7fb0ff;--accent-ink:#0b1625;--ok:#6fd49a;--okbg:#17321f;--warn:#f0c36a;--warnbg:#3a2d0f;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161f;--surface:#1a222e;--ink:#e8edf4;--muted:#9aa6b6;--line:#2c3746;--accent:#7fb0ff;--accent-ink:#0b1625;--ok:#6fd49a;--okbg:#17321f;--warn:#f0c36a;--warnbg:#3a2d0f;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;max-width:1280px;margin:0 auto}
.top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.01em}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 280px;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:500;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.pic{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.nopic{color:#8a93a1;font-size:13px;padding:12px;text-align:center}
.body{padding:10px 12px 12px;display:grid;gap:6px;min-width:0}
.adm{font-family:var(--display);font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.adm small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.nome{font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--okbg);color:var(--ok);font-variant-numeric:tabular-nums}
.pill.w{background:var(--warnbg);color:var(--warn)}
.ref{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,10,20,.6)}
.dh{display:flex;justify-content:space-between;gap:12px;padding:16px 16px 8px;align-items:flex-start}
.dh .adm{font-size:40px}
.x{font:inherit;font-size:20px;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:0 16px 12px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cp{font:inherit;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer;margin:0 16px 12px}
.cardimg{display:block;width:100%;max-width:100%;border-top:1px solid var(--line);background:#fff}
.cap{padding:8px 16px;color:var(--muted);font-size:13px}
.credit{max-width:1280px;margin:28px auto 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.credit strong{color:var(--ink);font-weight:600}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.adm{font-size:26px}.body{padding:8px}}
</style>

<header>
  <div class="top"><h1>Catálogo Atlas × Santri ADM</h1><span class="count" id="cnt" aria-live="polite"></span></div>
  <div class="search"><input id="q" type="search" placeholder="Digite o código ADM, nome, código Atlas ou código de barras" autocomplete="off" aria-label="Buscar produto"></div>
  <div class="chips" role="group" aria-label="Filtro">
    <button class="chip" data-f="all" aria-pressed="true">Todos</button>
    <button class="chip" data-f="cat" aria-pressed="false">No catálogo</button>
    <button class="chip" data-f="sem" aria-pressed="false">Fora de linha</button>
  </div>
</header>
<main><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>Nenhum produto encontrado. Confira o código digitado.</p></main>
<footer class="credit">Catálogo feito por <strong>Ismael Alves</strong> · Home Center Romanos · baseado no catálogo Atlas 2026</footer>
<dialog id="dlg" aria-label="Detalhe do produto"></dialog>
<script>
const P=window.__DATA__;
const norm=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
P.forEach(p=>p._s=norm([p.adm,p.nome,p.ref,p.bar].join(' ')));
const $=id=>document.getElementById(id);
let filt='all';
function qtyPill(p){
  if(!('page' in p)) return '<span class="pill w">Fora de linha</span>';
  return p.qty?`<span class="pill">Embalagem: ${p.qty} un</span>`:'<span class="pill w">Qtd. não informada</span>';
}
function card(p,i){
  const pic=p.img?`<img src="${p.img}" alt="${p.nome.replace(/"/g,'')}" loading="lazy" width="200" height="200">`:'<div class="nopic">Sem imagem no catálogo</div>';
  return `<button class="card" data-i="${i}"><div class="pic">${pic}</div><div class="body"><div class="adm"><small>ADM</small>${p.adm}</div><div class="nome">${p.nome}</div><div class="meta">${qtyPill(p)}</div><div class="ref">Cód. Atlas: ${p.ref||'—'}</div></div></button>`;
}
function render(){
  const terms=norm($('q').value).split(/\s+/).filter(Boolean);
  const list=[];
  P.forEach((p,i)=>{
    if(filt==='cat'&&!('page' in p))return; if(filt==='sem'&&('page' in p))return;
    if(terms.every(t=>p._s.includes(t))) list.push([p,i]);
  });
  // código ADM exato primeiro
  const q=$('q').value.trim();
  list.sort((a,b)=>(b[0].adm===q)-(a[0].adm===q));
  $('grid').innerHTML=list.map(([p,i])=>card(p,i)).join('');
  $('empty').hidden=list.length>0;
  $('cnt').textContent=`${list.length} de ${P.length} produtos`;
}
$('q').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  filt=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render();}));
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.i);});
function open(i){
  const p=P[i],d=$('dlg');
  const inCat='page' in p;
  d.innerHTML=`<div class="dh"><div><div class="adm"><small>ADM</small>${p.adm}</div><div class="nome">${p.nome}</div></div><button class="x" id="cl" aria-label="Fechar">×</button></div>
  <dl class="dl"><dt>Cód. Atlas</dt><dd>${p.ref||'—'}</dd><dt>Cód. de barras</dt><dd>${p.bar||'—'}</dd><dt>Embalagem</dt><dd>${inCat?(p.qty?p.qty+' unidades':'não informada no catálogo'):'fora de linha (não consta no catálogo 2026)'}</dd><dt>Catálogo</dt><dd>${inCat?'página '+p.page:'—'}</dd></dl>
  <button class="cp" id="cp">Copiar código ADM</button>
  ${p.card?`<img class="cardimg" src="${p.card}" alt="Trecho do catálogo com ${p.nome.replace(/"/g,'')}">`:''}
  ${inCat?'<div class="cap">Trecho da página '+p.page+' do catálogo Atlas 2026.</div>':''}`;
  d.showModal();
  $('cl').onclick=()=>d.close();
  $('cp').onclick=()=>{const b=$('cp');const done=()=>{b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar código ADM',1500)};
    try{navigator.clipboard.writeText(p.adm).then(done,()=>{b.textContent=p.adm})}catch(_){b.textContent=p.adm}};
}
$('dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
render();$('q').focus();
</script>
</body></html>
